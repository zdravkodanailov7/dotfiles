set -g mouse on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Pass Shift+Enter through to applications (e.g. Claude Code)
bind-key -n S-Enter send-keys Escape "[13;2u"

# Move window left (swap with previous window)
bind-key -r Left swap-window -t :-1

# Move window right (swap with next window)
bind-key -r Right swap-window -t :+1

# Follow macOS Appearance. The status job supports tmux 3.5a, which lacks
# client-light-theme/client-dark-theme hooks. Keep the usual right-hand status.
run-shell 'sh "$HOME/.tmux/sync-appearance.sh"'
set -g status-interval 5
set -g status-right '#{?window_zoomed_flag,#[reverse]#[bold] ZOOM #[default],}#(sh "$HOME/.tmux/sync-appearance.sh")#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %H:%M %d-%b-%y'
set -g extended-keys-format csi-u
