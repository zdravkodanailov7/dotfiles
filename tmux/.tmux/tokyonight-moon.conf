# TokyoNight Moon palette; independent of NvChad

# Status bar
set -g status-style "bg=#1e2030,fg=#c8d3f5"

# Active window tab
set -g window-status-current-style "bg=#82aaff,fg=#222436,bold"
set -g window-status-current-format " #I:#W "

# Inactive window tabs
set -g window-status-style "bg=#1e2030,fg=#828bb8"
set -g window-status-format " #I:#W "

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#82aaff"

# Messages
set -g message-style "bg=#222436,fg=#c8d3f5"
set -g message-command-style "bg=#222436,fg=#c8d3f5"

# Mode (copy mode highlight)
set -g mode-style "bg=#3b4261,fg=#c8d3f5"
