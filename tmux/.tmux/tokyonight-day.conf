# TokyoNight Day; the same layout as tokyonight-moon.conf.
set -g status-style "bg=#d0d5e3,fg=#3760bf"
set -g window-status-current-style "bg=#2e7de9,fg=#e1e2e7,bold"
set -g window-status-current-format " #I:#W "
set -g window-status-style "bg=#d0d5e3,fg=#6172b0"
set -g window-status-format " #I:#W "
set -g pane-border-style "fg=#a8aecb"
set -g pane-active-border-style "fg=#2e7de9"
set -g message-style "bg=#e1e2e7,fg=#3760bf"
set -g message-command-style "bg=#e1e2e7,fg=#3760bf"
set -g mode-style "bg=#b7c1e3,fg=#3760bf"
